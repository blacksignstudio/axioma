name: Local corpus and tooling checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved during preparation
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, resolved during preparation
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m axioma_context validate
      - run: python -m unittest discover -s tests -v
      - run: python tools/refresh_manifest.py
      - run: git diff --exit-code -- catalog.json provenance.json reading-manifest.json graph.json assets/corpus-graph.svg assets/graph-explorer.html manifest.json
